# docker-compose 部署
#
# 用法：
#   1. 复制环境模板：cp .env.example .env（.env 不入库），按需修改
#   2. 启动：docker compose up -d --build
#   3. 验证：curl localhost:${RAG_HTTP_PORT}/health
#
# 说明：
#   - 构建上下文是项目根（../..），复用根目录 Dockerfile
#   - 模型目录只读挂载到 /app/models；数据用命名卷 rag-data 持久化
#   - 所有变量都有默认值（${VAR:-default}），不配 .env 也能跑

services:
  rag-service:
    image: ghcr.io/juanniangdev/juan-rag:v1.0.0_beta
    container_name: rag-service
    restart: unless-stopped
    ports:
      - "${RAG_HTTP_PORT:-3000}:3000"
    environment:
      # 容器内固定配置（宿主端口见 .env 的 RAG_HTTP_PORT）
      RAG_MODEL_PATH: /app/models/${RAG_MODEL_FILE:-bge-small-zh-v1.5-q8_0.gguf}
      RAG_DATA_DIR: /app/data
      RAG_HOST: 0.0.0.0
      RAG_PORT: 3000
      # 可调项（来自 .env，未设置时用默认值）
      RAG_N_THREADS: ${RAG_N_THREADS:-4}
      RAG_N_CTX: ${RAG_N_CTX:-512}
      RAG_STORE_RAW_VECTORS: ${RAG_STORE_RAW_VECTORS:-true}
      RAG_LRU_CAPACITY: ${RAG_LRU_CAPACITY:-1024}
      RAG_MAX_CHUNK_CHARS: ${RAG_MAX_CHUNK_CHARS:-260}
      RAG_OVERLAP_CHARS: ${RAG_OVERLAP_CHARS:-50}
    volumes:
      # 模型目录（默认项目根 models/，可用 .env 的 MODEL_DIR 覆盖）
      - ${MODEL_DIR:-../../models}:/app/models:ro
      # 数据持久化（index.tvim + tags.bin）
      - rag-data:/app/data
    # 健康检查由镜像内置（Dockerfile HEALTHCHECK，探测 /health）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rag-data:
